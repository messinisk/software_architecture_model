name: Python Security

on:
  push:
    branches:
      - python3
    paths:
      - 'software_architecture_model_python/**'
      - 'pyproject.toml'
      - '.github/workflows/python-security.yml'

  pull_request:
    branches:
      - python3
    paths:
      - 'software_architecture_model_python/**'

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Bandit
        run: |
          bandit -r software_architecture_model_python

      - name: Pip Audit
        run: |
          pip-audit