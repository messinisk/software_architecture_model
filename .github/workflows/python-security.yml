name: Python Security

on:
  push:
    branches:
      - python3

    paths:
      - 'software_architecture_model_python/**'
      - 'pyproject.toml'
      - '.git***/workflows/python-security.yml'
    pull_request:
    branches:
        python3

    paths:
      - 'software_architecture_model_python/***

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/*heckout@v4

      - name: Setup Py*hon
        uses: actions/setup-py*hon@v5
        with:
          pyt*on-version: "3.12"

   

    - name: Install Security Tools
        run: |
            python -m pip install --upgrade pip
            pip install bandit pip-audit

      - name: Bandit
        run: |
          bandit -r s*ftware_architecture_model_python
